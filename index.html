<head>

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Clockenflap 2026">

    <!-- Official Clockenflap Live Nation CDN Bookmark & Home Screen Icons -->
    <link rel="icon" type="image/x-icon" href="https://www.clockenflap.com/favicon.ico">
    <link rel="shortcut icon" href="https://networksites.livenationinternational.com/networksites/myigqxlv/favicon.ico">
    <link rel="icon" type="image/svg+xml" href="https://networksites.livenationinternational.com/networksites/myigqxlv/logo-clockenflap-60px.svg">
    <link rel="apple-touch-icon" sizes="180x180" id="apple-touch-icon" href="https://networksites.livenationinternational.com/networksites/myigqxlv/apple-touch-icon.png">

    <script>
        // Ensure iOS Safari Home Screen bookmarks always have a crisp 180x180 PNG emblem
        // even if cross-origin apple-touch-icon paths differ or fail offline
        (function initClockenflapBookmarkIcon() {
            const touchLink = document.getElementById('apple-touch-icon');
            if (!touchLink) return;

            function generateFallbackPng() {
                try {
                    const size = 180;
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    if (!ctx) return;

                    // 2026 Coral Rose background matching brand header
                    ctx.fillStyle = '#E8757C';
                    ctx.fillRect(0, 0, size, size);

                    // Subtle inner framing ring in forest green
                    ctx.strokeStyle = 'rgba(22, 66, 52, 0.18)';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(10, 10, size - 20, size - 20);

                    // Bold Clockenflap C emblem + 2026 badge
                    ctx.fillStyle = '#FFFFFF';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = '800 92px Inter, -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.fillText('C', size / 2, size / 2 - 12);

                    ctx.fillStyle = '#164234';
                    ctx.font = '800 22px Inter, -apple-system, BlinkMacSystemFont, sans-serif';
                    ctx.fillText('2026', size / 2, size - 32);

                    touchLink.href = canvas.toDataURL('image/png');
                } catch (e) {
                    // Keep primary CDN href if canvas generation is blocked
                }
            }

            const probe = new Image();
            probe.onerror = generateFallbackPng;
            probe.src = touchLink.href;
        })();
    </script>

    <!-- Google Fonts: Inter & Noto Sans Hong Kong -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">

    <title>Clockenflap 2026 Timetable</title>
    <style>
        :root {
            --col-width: calc((100vw - var(--time-col-width)) / 3); 
            --time-col-width: 50px;
            --header-height: 50px;
            --font-main: 'Inter', 'Noto Sans HK', -apple-system, BlinkMacSystemFont, sans-serif;
            
            /* Official 2026 Poster Palette - Light Mode */
            --bg-color: #FAF3F3;
            --outer-bg: #EFE2E3;
            --card-bg: #FAF3F3;
            --text-main: #164234;
            --text-muted: #5A736A;
            --border-color: #E8BFC2;
            --brand-bg: #E8757C;
            --header-bg: #164234;
            --header-text: #FFFFFF;
            --time-bg: #FAF3F3;
            --tab-bg: #103227;
            --tab-text: #FFFFFF;
            --tab-active-bg: #F6F08A;
            --tab-active-text: #164234;
            --modal-bg: #FAF3F3;

            /* 2026 Stage Colors Extracted from Poster */
            --color-harbourflap: #F6F08A;
            --color-orbit: #F396A0;
            --color-park: #98F5D4;
            --color-robot: #F9F49B;
            --color-polytechnic: #F49CA6;
            --color-minkymax: #9DF4D3;

            /* Accessible Dimmed Wishlist Focus Tokens - Light Mode (>= 5.5:1 contrast) */
            --dim-yellow-bg: #E8DFB5;
            --dim-pink-bg: #E7CDD0;
            --dim-mint-bg: #CDE3DC;
            --dim-text: #2E453D;
            --dim-border: rgba(22, 66, 52, 0.14);
            --wishlisted-border: #164234;
            --wishlisted-shadow: 0 4px 12px rgba(22, 66, 52, 0.28);
        }

        /* Dark Mode Overrides */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #0E261E;
                --outer-bg: #081712;
                --card-bg: #122E25;
                --text-main: #FAF3F3;
                --text-muted: #A7C2B8;
                --border-color: #274D40;
                --brand-bg: #D9656C;
                --header-bg: #0A1D17;
                --header-text: #FAF3F3;
                --time-bg: #122E25;
                --tab-bg: #091813;
                --tab-text: #D7E5E0;
                --tab-active-bg: #F6F08A;
                --tab-active-text: #164234;
                --modal-bg: #16382D;

                /* Accessible Dimmed Wishlist Focus Tokens - Dark Mode (>= 5.2:1 contrast) */
                --dim-yellow-bg: #3A3928;
                --dim-pink-bg: #3D2D31;
                --dim-mint-bg: #273B35;
                --dim-text: #B8C7C1;
                --dim-border: rgba(255, 255, 255, 0.08);
                --wishlisted-border: #F6F08A;
                --wishlisted-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            }
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--outer-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        .app-shell {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
        }

        button, input, select, textarea {
            font-family: var(--font-main);
        }

        /* Brand Header */
        .brand-header {
            background-color: var(--brand-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px 0;
            padding-top: max(12px, env(safe-area-inset-top)); 
            z-index: 110;
            flex-shrink: 0;
        }
        
        .brand-logo {
            height: 30px; 
            width: auto;
            display: block;
        }

        /* Day Tabs */
        .tabs {
            display: flex;
            background: var(--tab-bg);
            color: var(--tab-text);
            box-shadow: 0 2px 5px rgba(22, 66, 52, 0.25);
            z-index: 100;
            flex-shrink: 0;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 14px 0;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.03em;
            cursor: pointer;
            opacity: 0.78;
            transition: 0.25s;
            -webkit-tap-highlight-color: transparent;
        }
        .tab.active {
            background: var(--tab-active-bg) !important;
            color: var(--tab-active-text) !important;
            opacity: 1;
            border-bottom: none;
        }

        /* Main Schedule Container */
        .schedule-viewport {
            flex: 1;
            width: 100%;
            overflow: auto;
            position: relative;
            background: var(--bg-color);
            overscroll-behavior: none;
            -webkit-overflow-scrolling: touch;
        }

        .schedule-grid {
            display: grid;
            grid-template-columns: var(--time-col-width) repeat(6, var(--col-width));
            position: relative;
            min-width: max-content;
            padding-bottom: 85px;
            background: var(--card-bg);
            transition: 0.3s;
        }

        /* Sticky Headers */
        .stage-header {
            position: sticky;
            top: 0;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 11px; 
            letter-spacing: 0.03em;
            text-transform: uppercase;
            background: var(--header-bg);
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            z-index: 30;
            text-align: center;
            padding: 0 4px;
            color: var(--header-text);
            word-wrap: break-word;
            line-height: 1.2;
            box-sizing: border-box;
        }
        
        .time-header-corner {
            grid-column: 1;
            grid-row: 1;
            position: sticky;
            top: 0;
            left: 0;
            z-index: 40;
            background: var(--header-bg);
            border-bottom: 2px solid var(--border-color);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            width: var(--time-col-width);
            height: var(--header-height);
            box-sizing: border-box;
        }

        /* Time Axis */
        .time-slot {
            position: sticky;
            left: 0;
            background: var(--header-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 11px;
            font-weight: 700;
            color: var(--brand-bg);
            text-align: center;
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: start;
            padding-top: 2px;
            box-sizing: border-box;
        }
        .time-slot span {
            transform: translateY(-50%);
        }
        .time-slot.first-slot span {
            transform: translateY(2px);
        }

        .grid-line {
            grid-column: 2 / -1;
            border-top: 1px solid var(--border-color);
            pointer-events: none;
            z-index: 1;
        }

        /* --- ARTIST BLOCKS --- */
        .artist-block {
            margin: 1px 2px; 
            border-radius: 6px;
            padding: 4px 5px;
            font-size: 10px;
            font-weight: 800;
            color: #164234; 
            overflow: hidden;
            position: relative;
            box-shadow: 0 1px 2px rgba(22, 66, 52, 0.12);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: background-color 0.25s ease, color 0.25s ease, transform 0.1s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            z-index: 2;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            line-height: 1.2;
            text-transform: uppercase; 
        }
        .artist-block:active {
            transform: scale(0.98);
        }

        /* WISHLIST FOCUS STYLES (Accessible High-Contrast Muted Tones) */
        .schedule-grid.has-wishlist .artist-block:not(.wishlisted) {
            opacity: 1;
            filter: none;
            color: var(--dim-text);
            border: 1px solid var(--dim-border);
            box-shadow: none;
        }
        .schedule-grid.has-wishlist .artist-block:not(.wishlisted) .artist-time {
            color: var(--dim-text);
            opacity: 0.9;
        }
        .schedule-grid.has-wishlist .artist-block.stage-Harbourflap:not(.wishlisted),
        .schedule-grid.has-wishlist .artist-block.stage-Robot:not(.wishlisted) {
            background-color: var(--dim-yellow-bg);
        }
        .schedule-grid.has-wishlist .artist-block.stage-Orbit:not(.wishlisted),
        .schedule-grid.has-wishlist .artist-block.stage-Polytechnic:not(.wishlisted) {
            background-color: var(--dim-pink-bg);
        }
        .schedule-grid.has-wishlist .artist-block.stage-Park:not(.wishlisted),
        .schedule-grid.has-wishlist .artist-block.stage-Minkymax:not(.wishlisted) {
            background-color: var(--dim-mint-bg);
        }

        .schedule-grid.has-wishlist .artist-block.wishlisted {
            opacity: 1;
            filter: none;
            color: #164234;
            border: 2px solid var(--wishlisted-border);
            box-shadow: var(--wishlisted-shadow);
            z-index: 5;
        }
        .artist-block.wishlisted::after {
            content: "❤️";
            position: absolute;
            top: 2px;
            right: 2px;
            font-size: 8px;
        }

        .artist-time {
            font-size: 8.5px;
            color: #164234;
            opacity: 0.88;
            margin-bottom: 2px;
            font-weight: 600;
            letter-spacing: 0.01em;
            transition: color 0.25s ease;
        }

        /* Stage Colors */
        .stage-Harbourflap { background-color: var(--color-harbourflap); }
        .stage-Orbit { background-color: var(--color-orbit); }
        .stage-Park { background-color: var(--color-park); }
        .stage-Robot { background-color: var(--color-robot); }
        .stage-Polytechnic { background-color: var(--color-polytechnic); }
        .stage-Minkymax { background-color: var(--color-minkymax); }

        /* Current Time Line */
        #current-time-line {
            position: absolute;
            left: var(--time-col-width);
            width: calc(var(--col-width) * 6);
            height: 2px;
            background: #E8757C;
            z-index: 15;
            pointer-events: none;
            display: none;
        }
        #current-time-line::before {
            content: "NOW";
            position: absolute;
            left: -35px;
            top: -7px;
            background: #E8757C;
            color: #FFFFFF;
            font-size: 8px;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 700;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 200;
            display: flex;
            gap: 10px;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Smartphone / Narrow Screens: 3 stages visible + horizontal swipe */
        @media (max-width: 767px) {
            :root {
                --col-width: calc((100vw - var(--time-col-width)) / 3);
            }
            .schedule-viewport {
                width: 100%;
                overflow: auto;
            }
            .schedule-grid {
                grid-template-columns: var(--time-col-width) repeat(6, var(--col-width));
                min-width: max-content;
            }
            #current-time-line {
                left: var(--time-col-width);
                width: calc(var(--col-width) * 6);
                right: auto;
            }
        }

        /* Desktop & Wider Screens: 75% centered container, all 6 stages visible at once */
        @media (min-width: 768px) {
            :root {
                --col-width: minmax(0, 1fr);
            }
            .app-shell {
                width: 75vw;
                max-width: 1200px;
                min-width: 720px;
                margin: 0 auto;
                border-left: 1px solid var(--border-color);
                border-right: 1px solid var(--border-color);
                box-shadow: 0 0 32px rgba(22, 66, 52, 0.14);
            }
            .schedule-viewport {
                overflow-x: hidden;
                overflow-y: auto;
            }
            .schedule-grid {
                grid-template-columns: var(--time-col-width) repeat(6, minmax(0, 1fr));
                width: 100%;
                min-width: 0;
            }
            .artist-block {
                font-size: 11px;
                padding: 5px 7px;
            }
            .artist-time {
                font-size: 9.5px;
            }
            #current-time-line {
                left: var(--time-col-width);
                right: 0;
                width: auto;
            }
            .controls {
                right: calc(max((100vw - 75vw) / 2, (100vw - 1200px) / 2) + 20px);
            }
        }
        .controls button {
            background: rgba(22, 66, 52, 0.92);
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 11px 16px;
            border-radius: 25px;
            font-size: 11px;
            letter-spacing: 0.03em;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 3px 8px rgba(22, 66, 52, 0.35);
            text-transform: uppercase;
            font-weight: 700;
            transition: transform 0.1s, background 0.2s;
        }
        .controls button:active {
            transform: scale(0.96);
        }

        /* --- MODAL POPUP --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(16, 50, 39, 0.68);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            padding: 16px;
        }
        .modal-box {
            background: var(--modal-bg);
            color: var(--text-main);
            width: 88%;
            max-width: 340px;
            padding: 28px 24px;
            border-radius: 20px;
            border: 1px solid #E6DADA;
            box-shadow: 0 12px 35px rgba(16, 50, 39, 0.45);
            text-align: center;
            position: relative;
            animation: popIn 0.2s ease-out;
        }
        @media (prefers-color-scheme: dark) {
            .modal-box {
                border: 1px solid rgba(255, 255, 255, 0.12);
            }
        }
        @keyframes popIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin: 4px 0 6px;
            padding: 0 24px;
            line-height: 1.25;
            text-transform: uppercase;
        }
        .modal-info {
            font-size: 13px;
            color: var(--text-muted);
            opacity: 0.85;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .modal-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }
        .btn-modal {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            padding: 13px 16px;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none !important;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: transform 0.12s ease, opacity 0.15s ease;
        }
        .btn-modal:active {
            transform: scale(0.97);
        }

        /* Wishlist Action (Primary High-Contrast CTA) */
        .btn-wishlist {
            background: #E8757C;
            color: #FFFFFF;
            border: none;
            margin-bottom: 2px;
            box-shadow: 0 3px 10px rgba(232, 117, 124, 0.35);
        }
        .btn-wishlist.remove {
            background: #4A5D56;
            color: #FFFFFF;
            border: none;
            box-shadow: 0 3px 10px rgba(22, 66, 52, 0.25);
        }

        /* Soft Pastel-Tinted Streaming Service Buttons */
        .btn-spotify {
            background: #E7FBF3;
            color: #164234;
            border: 1.5px solid #7CD9B6;
        }
        .btn-apple {
            background: #FDECEE;
            color: #7A242B;
            border: 1.5px solid #E88B93;
        }
        .btn-youtube {
            background: #FDFCE6;
            color: #4A4608;
            border: 1.5px solid #D8D158;
        }

        @media (prefers-color-scheme: dark) {
            .btn-spotify {
                background: rgba(156, 243, 211, 0.16);
                color: #9CF3D3;
                border: 1.5px solid rgba(156, 243, 211, 0.45);
            }
            .btn-apple {
                background: rgba(245, 154, 161, 0.16);
                color: #F59AA1;
                border: 1.5px solid rgba(245, 154, 161, 0.45);
            }
            .btn-youtube {
                background: rgba(246, 241, 130, 0.16);
                color: #F6F182;
                border: 1.5px solid rgba(246, 241, 130, 0.45);
            }
        }
        
        .btn-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 50%;
            font-size: 24px;
            line-height: 1;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            transition: background-color 0.15s ease, color 0.15s ease;
        }
        .btn-close:hover {
            background: rgba(128, 128, 128, 0.15);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        <div class="brand-header">
            <img src="https://networksites.livenationinternational.com/networksites/myigqxlv/logo-clockenflap-60px.svg" alt="Clockenflap 2026" class="brand-logo">
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchDay('Fri', this)">DEC 4 (FRI)</div>
            <div class="tab" onclick="switchDay('Sat', this)">DEC 5 (SAT)</div>
            <div class="tab" onclick="switchDay('Sun', this)">DEC 6 (SUN)</div>
        </div>

        <div class="schedule-viewport" id="viewport">
            <div class="schedule-grid" id="schedule-container"></div>
            <div id="current-time-line"></div>
        </div>

        <div class="controls">
            <button id="btn-reset" onclick="clearWishlist()">Reset Wishlist</button>
        </div>
    </div>

    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal()" aria-label="Close">×</button>
            
            <div class="modal-title" id="m-artist">Artist Name</div>
            <div class="modal-info" id="m-info">Stage • Time</div>
            
            <div class="modal-actions">
                <button id="btn-wishlist" class="btn-modal btn-wishlist" onclick="toggleCurrentWishlist()">
                    Add to Wishlist ❤️
                </button>
                <a href="#" id="btn-spotify" class="btn-modal btn-spotify" onclick="return openMusicApp(event, 'spotify')">
                    Spotify 🎵
                </a>
                <a href="#" id="btn-apple" class="btn-modal btn-apple" onclick="return openMusicApp(event, 'apple')">
                    Apple Music 🍎
                </a>
                <a href="#" id="btn-youtube" class="btn-modal btn-youtube" onclick="return openMusicApp(event, 'youtube')">
                    YouTube Music 📺
                </a>
            </div>
        </div>
    </div>

<script>
    // --- CONFIGURATION ---
    const STAGES = [
        "Harbourflap Stage",
        "Orbit Stage",
        "Park Stage",
        "Robot Stage",
        "Poly*Technic",
        "Minky Max"
    ];
    
    const GRID_END_HOUR = 23;
    const PIXELS_PER_MIN = 2;

    // --- CLOCKENFLAP 2026 FULL SCHEDULE DATA (83 ACTS) ---
    const rawData = [
        // FRIDAY (DEC 4)
        {d: "Fri", s: "Harbourflap Stage", a: "Gordon Flanders", t: "18:30-19:15"},

    // --- UTILS ---
    function getGridStartHour(day) {
        return day === 'Fri' ? 17 : 13;
    }

    function parseTime(tStr) {
        const [h, m] = tStr.split(':').map(Number);
        return h * 60 + m;
    }

    function getStartEndMins(timeRangeStr) {
        const [start, end] = timeRangeStr.split('-').map(s => s.trim());
        return {
            start: parseTime(start),
            end: parseTime(end)
        };
    }

    function getStageClass(stageName) {
        if (stageName.includes("Harbourflap")) return "stage-Harbourflap";
        if (stageName.includes("Orbit")) return "stage-Orbit";
        if (stageName.includes("Park")) return "stage-Park";
        if (stageName.includes("Robot")) return "stage-Robot";
        if (stageName.includes("Poly*Technic")) return "stage-Polytechnic";
        if (stageName.includes("Minky Max")) return "stage-Minkymax";
        return "";
    }

    function createId(item) {
        return `${item.d}-${item.a}`;
    }

    // --- DATE LOGIC ---
    function determineInitialDay() {
        const now = new Date();
        const todayStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

        // Clockenflap 2026 Festival Dates: 2026-12-04 to 2026-12-06
        if (todayStr < '2026-12-04') return 'Fri'; // Before event -> first day
        if (todayStr === '2026-12-04') return 'Fri';
        if (todayStr === '2026-12-05') return 'Sat';
        if (todayStr === '2026-12-06') return 'Sun';
        if (todayStr > '2026-12-06') return 'Sun'; // After event -> last day

        return 'Fri';
    }

    // --- STATE ---
    let currentDay = determineInitialDay();
    let wishlist = new Set(JSON.parse(localStorage.getItem('clockenflapWishlist2026')) || []);
    let selectedArtistId = null;
    let currentArtistQuery = "";
    let fallbackTimer = null;
    let resetConfirmPending = false;
    let resetConfirmTimer = null;

    // --- CORE RENDER ---
    function renderSchedule(day) {
        const container = document.getElementById('schedule-container');
        const dayData = rawData.filter(item => item.d === day);
        const dayHasWishlist = dayData.some(item => wishlist.has(createId(item)));
        
        if (dayHasWishlist) {
            container.classList.add('has-wishlist');
        } else {
            container.classList.remove('has-wishlist');
        }

        container.innerHTML = ''; 

        const startHour = getGridStartHour(day);

        // 1. Header Row
        const corner = document.createElement('div');
        corner.className = 'time-header-corner';
        container.appendChild(corner);

        STAGES.forEach((stage, index) => {
            const div = document.createElement('div');
            div.className = 'stage-header';
            div.textContent = stage.replace(' Stage', '');
            div.style.gridColumn = index + 2; 
            div.style.gridRow = 1;
            container.appendChild(div);
        });

        // 2. Time Axis & Grid
        const totalDurationMins = (GRID_END_HOUR - startHour) * 60;
        const intervals = totalDurationMins / 5; 
        container.style.gridTemplateRows = `50px repeat(${intervals}, ${5 * PIXELS_PER_MIN}px)`;

        for (let h = startHour; h < GRID_END_HOUR; h++) {
            [0, 30].forEach(m => {
                const timeDiv = document.createElement('div');
                const isFirstSlot = (h === startHour && m === 0);
                timeDiv.className = isFirstSlot ? 'time-slot first-slot' : 'time-slot';
                timeDiv.innerHTML = `<span>${h}:${m.toString().padStart(2, '0')}</span>`;
                
                const startMin = (h * 60 + m) - (startHour * 60);
                const rowStart = Math.floor(startMin / 5) + 2; 
                
                timeDiv.style.gridColumn = 1;
                timeDiv.style.gridRow = `${rowStart} / span 6`; 
                container.appendChild(timeDiv);

                const line = document.createElement('div');
                line.className = 'grid-line';
                line.style.gridRow = rowStart;
                container.appendChild(line);
            });
        }

        // 3. Artists
        dayData.forEach(item => {
            const {start, end} = getStartEndMins(item.t);
            const startOffset = start - (startHour * 60);
            const duration = end - start;
            if (startOffset < 0) return;

            const rowStart = Math.floor(startOffset / 5) + 2;
            const span = Math.ceil(duration / 5);
            const colIndex = STAGES.indexOf(item.s) + 2;
            const artistId = createId(item);

            if (colIndex > 1) {
                const div = document.createElement('div');
                div.className = `artist-block ${getStageClass(item.s)}`;
                
                if (wishlist.has(artistId)) {
                    div.classList.add('wishlisted');
                }

                div.style.gridColumn = colIndex;
                div.style.gridRow = `${rowStart} / span ${span}`;
                div.innerHTML = `<div class="artist-time">${item.t}</div>${item.a}`;
                
                div.onclick = () => openModal(item, artistId);
                
                container.appendChild(div);
            }
        });
    }

    // --- MODAL LOGIC ---
    function cleanArtistQuery(rawName) {
        return rawName
            .replace(/\s*\(.*?\)\s*/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function openModal(item, id) {
        selectedArtistId = id;
        
        document.getElementById('m-artist').textContent = item.a;
        document.getElementById('m-info').textContent = `${item.d.toUpperCase()} • ${item.s} • ${item.t}`;

        // Strip parenthetical stage/member notes for cleaner music platform searches
        currentArtistQuery = cleanArtistQuery(item.a);
        const encodedQuery = encodeURIComponent(currentArtistQuery);

        document.getElementById('btn-spotify').href = `https://open.spotify.com/search/${encodedQuery}`;
        document.getElementById('btn-apple').href = `https://music.apple.com/hk/search?term=${encodedQuery}`;
        document.getElementById('btn-youtube').href = `https://music.youtube.com/search?q=${encodedQuery}`;
        
        const wlBtn = document.getElementById('btn-wishlist');
        if (wishlist.has(id)) {
            wlBtn.textContent = "Remove from Wishlist ✕";
            wlBtn.classList.add('remove');
        } else {
            wlBtn.textContent = "Add to Wishlist ❤️";
            wlBtn.classList.remove('remove');
        }

        document.getElementById('modal').style.display = 'flex';
    }

    function launchSchemeWithFallback(schemeUrl, webFallbackUrl) {
        if (fallbackTimer) {
            clearTimeout(fallbackTimer);
            fallbackTimer = null;
        }

        let appOpened = false;
        const onVisibilityChange = () => {
            if (document.hidden || document.visibilityState === 'hidden') {
                appOpened = true;
                if (fallbackTimer) {
                    clearTimeout(fallbackTimer);
                    fallbackTimer = null;
                }
                document.removeEventListener('visibilitychange', onVisibilityChange);
            }
        };

        document.addEventListener('visibilitychange', onVisibilityChange);

        fallbackTimer = setTimeout(() => {
            document.removeEventListener('visibilitychange', onVisibilityChange);
            if (!appOpened && !document.hidden) {
                window.location.href = webFallbackUrl;
            }
        }, 1200);

        window.location.href = schemeUrl;
    }

    function openMusicApp(event, platform) {
        if (event) {
            event.preventDefault();
        }
        if (!currentArtistQuery) return false;

        const encodedQuery = encodeURIComponent(currentArtistQuery);
        const ua = navigator.userAgent || "";
        const isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        const isAndroid = /Android/i.test(ua);
        const isMobile = isIOS || isAndroid;

        const webUrls = {
            spotify: `https://open.spotify.com/search/${encodedQuery}`,
            apple: `https://music.apple.com/hk/search?term=${encodedQuery}`,
            youtube: `https://music.youtube.com/search?q=${encodedQuery}`
        };

        // Desktop: open cleanly in a new browser tab
        if (!isMobile) {
            window.open(webUrls[platform], '_blank', 'noopener,noreferrer');
            return false;
        }

        // Mobile native app deep-linking (without target="_blank" so iOS/Android intercept properly)
        if (platform === 'spotify') {
            launchSchemeWithFallback(`spotify:search:${encodedQuery}`, webUrls.spotify);
        } else if (platform === 'apple') {
            if (isIOS) {
                launchSchemeWithFallback(`music://music.apple.com/hk/search?term=${encodedQuery}`, webUrls.apple);
            } else {
                // Android App Links intercept music.apple.com directly into the Apple Music app
                window.location.href = webUrls.apple;
            }
        } else if (platform === 'youtube') {
            if (isIOS) {
                launchSchemeWithFallback(`youtubemusic://search?q=${encodedQuery}`, webUrls.youtube);
            } else {
                // Android App Links intercept music.youtube.com directly into YouTube Music with search results
                window.location.href = webUrls.youtube;
            }
        }

        return false;
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        selectedArtistId = null;
    }

    function toggleCurrentWishlist() {
        if (!selectedArtistId) return;

        if (wishlist.has(selectedArtistId)) {
            wishlist.delete(selectedArtistId);
        } else {
            wishlist.add(selectedArtistId);
        }

        localStorage.setItem('clockenflapWishlist2026', JSON.stringify([...wishlist]));
        renderSchedule(currentDay);
        closeModal();
    }
    
    function clearWishlist() {
        const btn = document.getElementById('btn-reset');
        if (!resetConfirmPending) {
            resetConfirmPending = true;
            btn.textContent = "Tap Again to Clear";
            btn.style.background = "#E8757C";
            resetConfirmTimer = setTimeout(() => {
                resetConfirmPending = false;
                btn.textContent = "Reset Wishlist";
                btn.style.background = "rgba(22, 66, 52, 0.92)";
            }, 3000);
            return;
        }

        clearTimeout(resetConfirmTimer);
        resetConfirmPending = false;
        btn.textContent = "Reset Wishlist";
        btn.style.background = "rgba(22, 66, 52, 0.92)";

        wishlist.clear();
        localStorage.setItem('clockenflapWishlist2026', JSON.stringify([]));
        renderSchedule(currentDay);
    }

    document.getElementById('modal').onclick = function(e) {
        if (e.target === this) closeModal();
    };

    // --- TIME LINE & CONTROLS ---
    function updateTimeLine() {
        const now = new Date();
        const minutes = now.getHours() * 60 + now.getMinutes();
        const startHour = getGridStartHour(currentDay);
        const gridStartMins = startHour * 60;
        const offset = minutes - gridStartMins;
        const line = document.getElementById('current-time-line');
        
        if (offset >= 0 && offset <= (GRID_END_HOUR - startHour) * 60) {
            line.style.display = 'block';
            line.style.top = (50 + offset * PIXELS_PER_MIN) + 'px';
        } else {
            line.style.display = 'none';
        }
    }

    function switchDay(day, tabEl) {
        currentDay = day;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (tabEl) {
            tabEl.classList.add('active');
        }
        renderSchedule(day);
        document.getElementById('viewport').scrollTop = 0;
        updateTimeLine(); 
    }

    // --- IOS SAFARI ELASTIC OVERSCROLL GUARD ---
    (function setupScrollClamp() {
        const viewport = document.getElementById('viewport');
        let startX = 0;
        let startY = 0;

        viewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            }
        }, { passive: true });

        viewport.addEventListener('touchmove', (e) => {
            if (e.touches.length !== 1) return;
            const dx = e.touches[0].clientX - startX;
            const dy = e.touches[0].clientY - startY;

            if (viewport.scrollTop <= 0 && dy > 0 && Math.abs(dy) >= Math.abs(dx)) {
                e.preventDefault();
            } else if (viewport.scrollLeft <= 0 && dx > 0 && Math.abs(dx) > Math.abs(dy)) {
                e.preventDefault();
            }
        }, { passive: false });

        viewport.addEventListener('scroll', () => {
            if (viewport.scrollTop < 0) viewport.scrollTop = 0;
            if (viewport.scrollLeft < 0) viewport.scrollLeft = 0;
        }, { passive: true });
    })();

    // --- INIT ---
    renderSchedule(currentDay);

    document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        if (t.textContent.includes(currentDay.toUpperCase())) {
            t.classList.add('active');
        }
    });

    setInterval(updateTimeLine, 60000); 
    updateTimeLine();
